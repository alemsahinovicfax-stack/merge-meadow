<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600&amp;family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
</helmet>
<div data-layer="MetaHub" style="width:1080px;height:1920px;flex:0 0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#FFF8F0">
  <dc-import name="HubScreen" part="header" theme="dark" page-bg="#FFF8F0" hint-size="1080px,143px"></dc-import>
  <div data-layer="CollectionJournal" style="position:relative;flex:0 0 auto;height:1597px;background:#FFF8F0;overflow:hidden;font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased">
    <div data-layer="RootVBox" style="position:absolute;left:24px;top:16px;width:1032px;height:1565px;display:flex;flex-direction:column;gap:6px">
      <div data-layer="TopBar" style="flex:0 0 auto;height:100px">
        <img data-layer="TitleLabel" src="title_bloom_album.png" alt="Bloom Album" style="display:block;width:1032px;height:100px;object-fit:contain">
      </div>
      <div data-layer="ListTopSpacer" style="flex:0 0 auto;height:16px"></div>
      <div data-layer="ListScroll" style="flex:1;min-height:0;position:relative;overflow:hidden">
        <div data-layer="List" style="width:1024px;display:flex;flex-direction:column;gap:16px">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
            <div data-layer="CollectionJournalRow" style="position:relative;flex:0 0 auto;box-sizing:border-box;width:1024px;padding:20px 22px;border-radius:26px;background:{{ r.bg }};box-shadow:inset 0 0 0 3px rgba(45,52,54,.14),0 4px 4px rgba(45,52,54,.10)">
              <div style="display:flex;flex-direction:column;gap:8px">
                <div data-layer="TitleRow" style="display:flex;gap:10px;align-items:flex-start">
                  <div data-layer="Title" style="flex:1;min-width:0;font:600 26px/35px 'Open Sans',system-ui,sans-serif;color:#4A4A4A">{{ r.name }}</div>
                  <div data-layer="Stars" style="flex:0 0 auto;font:600 24px/33px 'Open Sans',system-ui,sans-serif;color:#4A4A4A">{{ r.stars }}</div>
                </div>
                <div data-layer="TierIconsRow" style="display:flex;gap:44px">
                  <sc-for list="{{ r.tiers }}" as="t" hint-placeholder-count="3">
                    <div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px">
                      <div data-layer="{{ t.layer }}" style="position:relative;width:128px;height:128px;overflow:hidden">
                        <img src="{{ t.src }}" alt="" style="{{ t.artStyle }}">
                        <svg viewBox="0 0 128 128" width="128" height="128" style="{{ t.lockStyle }}"><circle cx="64" cy="64" r="28.16" fill="rgba(140,148,140,.35)" stroke="rgba(102,107,102,.5)" stroke-width="2"></circle></svg>
                      </div>
                      <div style="align-self:stretch;text-align:center;font:600 20px/27px 'Open Sans',system-ui,sans-serif;color:{{ t.capColor }}">{{ t.label }}</div>
                    </div>
                  </sc-for>
                </div>
              </div>
            </div>
          </sc-for>
        </div>
        <div data-layer="VScrollBar" style="position:absolute;right:0;top:0;bottom:0;width:8px;border-radius:4px;background:rgba(26,26,26,.6)">
          <div data-layer="Grabber" style="position:absolute;left:0;right:0;top:0;height:165px;border-radius:4px;background:rgba(57,57,57,.6)"></div>
        </div>
      </div>
    </div>
  </div>
  <dc-import name="HubScreen" part="footer" theme="dark" page-bg="#FFF8F0" active="{{ 1 }}" hint-size="1080px,180px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920}}">
// Recreation of game/scenes/ui/collection_journal.tscn + collection_journal_row.gd + collection_bloom_icon.gd as they are today.
const BG = { 1: '#B8D4F0', 2: '#E0C4FF', 3: '#FFE8B8' };
const ROWS = [
  ['clover', 'Meadow Clover', 1, 'album_t3'],
  ['daisy', 'Field Daisy', 1, 'album_t2'],
  ['buttercup', 'Buttercup Lane', 1, 'album_t2'],
  ['tulip', 'Barn Tulip', 2, 'seen'],
  ['sunflower', 'Sunfence', 2, 'seen'],
  ['pumpkin', 'Harvest Pumpkin', 3, 'album_t3'],
  ['frost_snowdrop', 'Frost Snowdrop', 1, 'album_t2']
];

class Component extends DCLogic {
  renderVals() {
    const rows = ROWS.map(([id, name, r, state]) => {
      const locked = state === 'locked';
      const kept = state === 'album_t3' ? 3 : state === 'album_t2' ? 2 : 0;
      return {
        name: locked ? '???' : name,
        stars: '★'.repeat(r),
        bg: locked ? '#E4E4E0' : BG[r],
        tiers: [1, 2, 3].map(t => {
          const on = !locked && (t === 1 || kept >= t);
          const hasTex = ['clover', 'daisy', 'buttercup', 'tulip', 'sunflower', 'pumpkin'].includes(id);
          return {
            layer: 'TierIcon' + t,
            label: 'T' + t,
            src: on && hasTex ? 'flowers/' + id + '_t' + t + '.svg' : 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==',
            artStyle: on && hasTex ? 'position:absolute;left:9.69px;top:5.83px;width:108.62px;height:108.62px;display:block' : 'display:none',
            lockStyle: on ? 'display:none' : 'position:absolute;inset:0;display:block',
            capColor: on ? '#387A47' : '#8C948C'
          };
        })
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
