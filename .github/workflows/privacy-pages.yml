# Publishes only privacy/ to GitHub Pages (not the full repo).
# Requires: repo public (free) OR GitHub Pro (private + Pages).
# Settings → Pages → Source: GitHub Actions

name: Privacy policy Pages

on:
  push:
    branches: [master]
    paths:
      - "privacy/**"
      - ".github/workflows/privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: privacy
      - id: deployment
        uses: actions/deploy-pages@v4
