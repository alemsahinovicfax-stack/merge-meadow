<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#2D3436}a:hover{color:#9E6645}@keyframes fieldRipple{0%{transform:scale(1);opacity:.7}60%{transform:scale(1.16);opacity:0}100%{transform:scale(1.16);opacity:0}}</style>
</helmet>
<div data-layer="HomeScreen" data-screen-label="{{ sceneLabel }}" style="width:1080px;height:1920px;flex:0 0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#2A2233;font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased">

  <div data-layer="Header" style="flex:0 0 143px;position:relative;z-index:5;background:#2A2233;box-shadow:0 6px 14px rgba(20,14,26,.34)">
    <div style="height:140px;display:flex;align-items:center;gap:16px;padding:0 0 0 20px;box-sizing:border-box">
      <div data-layer="CoinChip" style="width:296px;height:100px;flex:0 0 auto;box-sizing:border-box;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 18px 0 14px;background:#1F1926;border:2px solid rgba(255,248,240,.14)"><img src="icons/icon_coin.svg" alt="" style="width:64px;height:64px;flex:0 0 auto"><div style="flex:1;min-width:0;text-align:right;font:800 48px/1 Nunito,system-ui,sans-serif;color:#FFF8F0;font-variant-numeric:tabular-nums;white-space:nowrap">{{ coinsText }}</div></div>
      <div data-layer="SeedChip" style="width:296px;height:100px;flex:0 0 auto;box-sizing:border-box;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 18px 0 14px;background:#1F1926;border:2px solid rgba(255,248,240,.14)"><img src="icons/icon_seed.svg" alt="" style="width:64px;height:64px;flex:0 0 auto"><div style="flex:1;min-width:0;text-align:right;font:800 48px/1 Nunito,system-ui,sans-serif;color:#FFF8F0;font-variant-numeric:tabular-nums;white-space:nowrap">112</div></div>
      <div data-layer="FlowerChip" style="width:296px;height:100px;flex:0 0 auto;box-sizing:border-box;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 18px 0 14px;background:#1F1926;border:2px solid rgba(255,248,240,.14)"><img src="icons/icon_flower.svg" alt="" style="width:64px;height:64px;flex:0 0 auto"><div style="flex:1;min-width:0;text-align:right;font:800 48px/1 Nunito,system-ui,sans-serif;color:#FFF8F0;font-variant-numeric:tabular-nums;white-space:nowrap">31</div></div>
      <div data-layer="SettingsSlot" style="width:124px;height:140px;flex:0 0 auto;display:flex;align-items:center;padding-left:4px;box-sizing:border-box"><div data-layer="SettingsButton" style="width:100px;height:100px;box-sizing:border-box;border-radius:20px;background:rgba(255,248,240,.10);border:2px solid rgba(255,248,240,.38);display:grid;place-items:center"><img src="icons/icon_settings_light.svg" alt="" style="width:56px;height:56px"></div></div>
    </div>
    <div style="height:3px;background:rgba(255,248,240,.55)"></div>
  </div>

  <div data-layer="HomePage" style="{{ pageStyle }}">
    <div data-layer="SeasonSelect" style="position:absolute;left:0;top:0;width:1080px;height:1633px">

      <div data-layer="SeasonTabs" style="{{ tabsStyle }}">
        <div data-layer="FreeTab" onClick="{{ onFree }}" style="{{ freeTabStyle }}">
          <img src="icons/icon_seed.svg" alt="" style="width:56px;height:56px;flex:0 0 auto">
          <div style="font:900 46px/1 Nunito,system-ui,sans-serif;color:#2D3436">Free</div>
        </div>
        <div data-layer="PremiumTab" onClick="{{ onPremium }}" style="{{ premTabStyle }}">
          <img src="icons/icon_diamond.svg" alt="" style="width:56px;height:56px;flex:0 0 auto">
          <div style="font:900 46px/1 Nunito,system-ui,sans-serif;color:#2D3436">Premium</div>
        </div>
      </div>

      <div data-layer="OpenTransition" style="position:absolute;left:0;top:0;width:1080px;height:1633px;pointer-events:none">
        <div data-layer="SeasonCard" onClick="{{ onCard }}" onPointerDown="{{ onCardDown }}" style="{{ cardStyle }}">
          <div data-layer="CardSky" style="{{ skyStyle }}"></div>
          <div data-layer="CardGround" style="{{ groundStyle }}"></div>
          <div data-layer="CardNear" style="{{ nearStyle }}"></div>
          <div data-layer="CardContent" style="{{ contentStyle }}">
            <sc-if value="{{ premium }}" hint-placeholder-val="{{ false }}">
              <div data-layer="PremiumRim" style="position:absolute;left:14px;top:14px;right:14px;bottom:14px;border-radius:36px;border:8px solid #FFD56B;pointer-events:none"></div>
            </sc-if>
            <div data-layer="SeasonRoster" style="position:absolute;left:0;top:0;width:1032px;height:1160px">
              <sc-for list="{{ roster }}" as="f" hint-placeholder-count="6">
                <div data-layer="RosterFlower" style="{{ f.wrap }}">
                  <div style="{{ f.disc }}"><img src="{{ f.src }}" alt="" style="{{ f.art }}"><div data-layer="LockVeil" style="{{ f.veil }}"></div></div>
                  <sc-if value="{{ f.missing }}" hint-placeholder-val="{{ false }}">
                    <div style="font:900 38px/1 Nunito,system-ui,sans-serif;color:#1A1A14;white-space:nowrap">{{ f.name }}</div>
                  </sc-if>
                </div>
              </sc-for>
              <sc-if value="{{ blockLock }}" hint-placeholder-val="{{ false }}">
                <div data-layer="RosterLock" style="position:absolute;left:456px;top:436px;width:120px;height:120px;box-sizing:border-box;border-radius:60px;background:#FFF8F0;border:4px solid #2D3436;box-shadow:0 6px 0 rgba(26,26,20,.24);display:grid;place-items:center"><img src="icons/icon_lock.svg" alt="" style="width:60px;height:60px"></div>
              </sc-if>
            </div>
            <div data-layer="CardStatus" style="position:absolute;left:0;right:0;top:830px;height:280px;display:flex;align-items:center;justify-content:center">
              <sc-if value="{{ stOpen }}" hint-placeholder-val="{{ false }}">
                <div data-layer="OpenGate" data-btn="1" onClick="{{ onGate }}" style="width:150px;height:150px;box-sizing:border-box;border-radius:75px;background:#FFF8F0;border:4px solid #2D3436;box-shadow:0 8px 0 rgba(26,26,20,.28);display:flex;align-items:flex-end;justify-content:center;padding-bottom:34px;cursor:pointer">
                  <div style="width:72px;height:62px;box-sizing:border-box;border-radius:36px 36px 0 0;background:#FFB88C;border:4px solid #2D3436;border-bottom:0"></div>
                </div>
              </sc-if>
              <sc-if value="{{ stLocked }}" hint-placeholder-val="{{ false }}">
                <div data-layer="UnlockNeeds" style="display:flex;gap:24px">
                  <div data-layer="NeedCoins" style="{{ needCoinStyle }}"><img src="icons/icon_coin.svg" alt="" style="width:60px;height:60px;flex:0 0 auto"><span style="font:900 46px/1 Nunito,system-ui,sans-serif;color:#2D3436;font-variant-numeric:tabular-nums;white-space:nowrap">{{ coinNeed }}</span></div>
                  <div data-layer="NeedStars" style="{{ needStarStyle }}"><img src="{{ prevArt }}" alt="" style="width:64px;height:64px;flex:0 0 auto"><span style="font:900 38px/1 Nunito,system-ui,sans-serif;color:#9E6645">★3</span><span style="font:900 46px/1 Nunito,system-ui,sans-serif;color:#2D3436;font-variant-numeric:tabular-nums;white-space:nowrap">{{ starNeed }}</span></div>
                </div>
              </sc-if>
              <sc-if value="{{ stUnlock }}" hint-placeholder-val="{{ false }}">
                <div data-layer="UnlockButton" data-btn="1" onClick="{{ onUnlock }}" style="height:140px;box-sizing:border-box;border-radius:70px;background:#FFD56B;border:4px solid #2D3436;box-shadow:0 8px 0 rgba(26,26,20,.28);display:flex;align-items:center;gap:18px;padding:0 48px 0 36px;cursor:pointer">
                  <img src="icons/icon_lock.svg" alt="" style="width:56px;height:56px"><span style="font:900 54px/1 Nunito,system-ui,sans-serif;color:#2D3436">Unlock</span>
                  <div style="width:3px;height:64px;background:rgba(45,52,54,.35);margin:0 6px"></div>
                  <img src="icons/icon_coin.svg" alt="" style="width:56px;height:56px"><span style="font:900 54px/1 Nunito,system-ui,sans-serif;color:#2D3436;font-variant-numeric:tabular-nums">500</span>
                </div>
              </sc-if>
              <sc-if value="{{ stBuy }}" hint-placeholder-val="{{ false }}">
                <div data-layer="PriceButton" data-btn="1" onClick="{{ onBuy }}" style="height:140px;box-sizing:border-box;border-radius:70px;background:#FFD56B;border:4px solid #2D3436;box-shadow:0 8px 0 rgba(26,26,20,.28);display:flex;align-items:center;gap:18px;padding:0 56px 0 40px;cursor:pointer">
                  <img src="icons/icon_diamond.svg" alt="" style="width:64px;height:64px"><span style="font:900 60px/1 Nunito,system-ui,sans-serif;color:#2D3436;font-variant-numeric:tabular-nums">{{ price }}</span>
                </div>
              </sc-if>
              <sc-if value="{{ stOwned }}" hint-placeholder-val="{{ false }}">
                <div data-layer="OwnedChip" style="height:120px;box-sizing:border-box;border-radius:60px;background:#A8E6CF;border:4px solid #2D3436;display:flex;align-items:center;gap:18px;padding:0 48px 0 36px">
                  <div style="width:22px;height:40px;border-right:9px solid #2D3436;border-bottom:9px solid #2D3436;transform:rotate(45deg) translate(-4px,-6px)"></div>
                  <span style="font:900 50px/1 Nunito,system-ui,sans-serif;color:#2D3436">Yours</span>
                </div>
              </sc-if>
              <sc-if value="{{ stSoon }}" hint-placeholder-val="{{ false }}">
                <div data-layer="SoonChip" style="height:120px;box-sizing:border-box;border-radius:60px;background:#FFF8F0;border:4px dashed #2D3436;display:flex;align-items:center;padding:0 52px">
                  <span style="font:900 50px/1 Nunito,system-ui,sans-serif;color:#2D3436">Coming soon</span>
                </div>
              </sc-if>
            </div>
          </div>
        </div>

        <sc-if value="{{ fieldMounted }}" hint-placeholder-val="{{ false }}">
        <div data-layer="FieldClip" style="{{ clipStyle }}">
          <div data-layer="FieldLayer" style="{{ fieldInnerStyle }}">
            <dc-import name="FieldScreen" season="{{ activeKey }}" scene="{{ fieldScene }}" u="{{ u }}" page-only="{{ true }}" embedded="{{ true }}" no-bands="{{ noBands }}" on-seasons="{{ onSeasons }}" style="width:1080px;height:1633px" hint-size="1080px,1633px"></dc-import>
          </div>
        </div>
        </sc-if>

        <div data-layer="CardEdge" style="{{ edgeStyle }}"></div>

        <div data-layer="SeasonName" style="{{ nameStyle }}">{{ seasonName }}</div>

        <sc-if value="{{ showPip }}" hint-placeholder-val="{{ true }}">
          <div data-layer="MeadowPip" style="{{ pipStyle }}">
            <div style="{{ pipShadowStyle }}"></div>
            <img src="icons/pip_idle.svg" alt="" style="position:relative;display:block;width:100%;height:100%">
          </div>
        </sc-if>

        <div data-layer="PlayButton" onClick="{{ onPlay }}" style="{{ playStyle }}">
          <sc-if value="{{ playOpens }}" hint-placeholder-val="{{ true }}">
            <div style="{{ playRowStyle }}">
              <div style="{{ triStyle }}"></div>
              <div style="{{ playTextStyle }}">Play</div>
            </div>
          </sc-if>
          <sc-if value="{{ playReturns }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;align-items:center;gap:22px">
              <div data-layer="PlaySeasonDisc" style="{{ backDiscStyle }}"><img src="{{ activeArt }}" alt="" style="width:84px;height:84px"></div>
              <div style="width:22px;height:22px;border-left:8px solid #2D3436;border-bottom:8px solid #2D3436;transform:rotate(45deg);margin-left:4px"></div>
              <div style="font:900 66px/1 Nunito,system-ui,sans-serif;color:#2D3436">Back</div>
            </div>
          </sc-if>
        </div>
      </div>

      <div data-layer="CardNav" style="{{ navStyle }}">
        <sc-if value="{{ hasPrev }}" hint-placeholder-val="{{ true }}">
          <div data-layer="PrevSeason" onClick="{{ onPrev }}" style="position:absolute;left:28px;top:680px;width:120px;height:120px;box-sizing:border-box;border-radius:60px;background:#FFF8F0;border:4px solid #2D3436;box-shadow:0 6px 0 rgba(26,26,20,.24);display:grid;place-items:center;cursor:pointer;pointer-events:auto"><div style="width:26px;height:26px;border-left:9px solid #2D3436;border-bottom:9px solid #2D3436;transform:rotate(45deg);margin-left:12px"></div></div>
        </sc-if>
        <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ true }}">
          <div data-layer="NextSeason" onClick="{{ onNext }}" style="position:absolute;right:28px;top:680px;width:120px;height:120px;box-sizing:border-box;border-radius:60px;background:#FFF8F0;border:4px solid #2D3436;box-shadow:0 6px 0 rgba(26,26,20,.24);display:grid;place-items:center;cursor:pointer;pointer-events:auto"><div style="width:26px;height:26px;border-right:9px solid #2D3436;border-top:9px solid #2D3436;transform:rotate(45deg);margin-right:12px"></div></div>
        </sc-if>
        <div data-layer="SeasonDots" style="position:absolute;left:0;right:0;top:1180px;display:flex;justify-content:center;align-items:center;gap:22px;pointer-events:none">
          <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4"><div style="{{ d.style }}"></div></sc-for>
        </div>
      </div>
    </div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div data-layer="Toast" style="position:absolute;left:240px;top:1250px;width:600px;height:100px;box-sizing:border-box;border-radius:28px;background:#2D3436;display:grid;place-items:center;font:900 44px/1 Nunito,system-ui,sans-serif;color:#FFF8F0;z-index:6;pointer-events:none">{{ toast }}</div>
    </sc-if>
  </div>

  <div data-layer="Footer" style="flex:0 0 144px;position:relative;z-index:5;background:#2A2233;box-shadow:0 -6px 14px rgba(20,14,26,.34)">
    <div style="height:3px;background:rgba(255,248,240,.55)"></div>
    <div style="position:relative;height:141px;display:flex">
      <div data-layer="ActiveIndicator" style="position:absolute;top:6px;left:504px;width:72px;height:8px;border-radius:4px;z-index:1;background:#FFB88C"></div>
      <div data-layer="Tab_Shop" style="width:216px;height:141px;flex:0 0 auto;position:relative"><div style="position:absolute;left:16px;top:20px;width:184px;height:108px;border-radius:20px;display:grid;place-items:center"><img src="icons/tab_shop_light.svg" alt="Shop" style="width:64px;height:64px;display:block;opacity:.82"></div></div>
      <div data-layer="Tab_Journal" style="width:216px;height:141px;flex:0 0 auto;position:relative"><div style="position:absolute;left:16px;top:20px;width:184px;height:108px;border-radius:20px;display:grid;place-items:center"><img src="icons/tab_journal_light.svg" alt="Journal" style="width:64px;height:64px;display:block;opacity:.82"></div></div>
      <div data-layer="Tab_Home" style="width:216px;height:141px;flex:0 0 auto;position:relative"><div style="position:absolute;left:16px;top:20px;width:184px;height:108px;box-sizing:border-box;border-radius:20px;display:grid;place-items:center;background:#FFB88C;border:2px solid rgba(45,52,54,.14)"><img src="icons/tab_home.svg" alt="Home" style="width:72px;height:72px;display:block;transform:translateY(-2px)"></div></div>
      <div data-layer="Tab_Camp" style="width:216px;height:141px;flex:0 0 auto;position:relative"><div style="position:absolute;left:16px;top:20px;width:184px;height:108px;border-radius:20px;display:grid;place-items:center"><img src="icons/tab_camp_light.svg" alt="Camp" style="width:64px;height:64px;display:block;opacity:.82"></div></div>
      <div data-layer="Tab_Arena" style="width:216px;height:141px;flex:0 0 auto;position:relative"><div style="position:absolute;left:16px;top:20px;width:184px;height:108px;border-radius:20px;display:grid;place-items:center"><img src="icons/tab_arena_light.svg" alt="Arena" style="width:64px;height:64px;display:block;opacity:.82"></div></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;free_active&quot;,&quot;free_open&quot;,&quot;free_locked&quot;,&quot;free_unlock&quot;,&quot;premium_buy&quot;,&quot;premium_owned&quot;,&quot;premium_soon&quot;],&quot;default&quot;:&quot;free_active&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;free&quot;,&quot;premium&quot;],&quot;default&quot;:&quot;free&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;},&quot;openT&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Transition&quot;},&quot;closeT&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:0,&quot;max&quot;:1,&quot;step&quot;:0.05,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Transition&quot;},&quot;pipWalked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Transition&quot;},&quot;fieldScene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gift&quot;,&quot;basket_empty&quot;,&quot;first&quot;],&quot;default&quot;:&quot;gift&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;State&quot;}}">
const SEASONS = {
  country_bloom: { n: 'Country Bloom', g: '#E6F2DB', r: ['clover', 'daisy', 'buttercup'] },
  frost_orchard: { n: 'Frost Orchard', g: '#D1E6FF', r: ['frost_snowdrop', 'silver_aconite', 'clover'] },

  amber_canopy: { n: 'Amber Canopy', g: '#FFEBC7', r: ['tulip', 'sunflower', 'pumpkin'] },
  moonlit_warren: { n: 'Moonlit Warren', g: '#B8BDFF', r: ['silver_aconite', 'frost_snowdrop', 'tulip'] },
  coral_tide: { n: 'Coral Tide', g: '#FFE0D6', r: ['daisy', 'tulip', 'buttercup'] },
  starfall_glade: { n: 'Starfall Glade', g: '#DBCCFF', r: ['silver_aconite', 'daisy', 'sunflower'] },
  ember_fen: { n: 'Ember Fen', g: '#FFC79E', r: ['buttercup', 'pumpkin', 'tulip'] }
};
const NAMES = { clover: 'Clover', daisy: 'Daisy', buttercup: 'Buttercup', tulip: 'Tulip', sunflower: 'Sunflower', pumpkin: 'Pumpkin', frost_snowdrop: 'Snowdrop', silver_aconite: 'Aconite' };
const FREE = ['country_bloom', 'frost_orchard', 'lantern_meadow', 'amber_canopy'];
const PREM = ['moonlit_warren', 'coral_tide', 'starfall_glade', 'ember_fen'];
const PRICE = { moonlit_warren: '$4.99', coral_tide: '$4.99', starfall_glade: '$4.99', ember_fen: null };
const MISSING = { lantern_meadow: ['daisy'] };
// Round 3: all six flowers. Row 1 = the round-2 trio (signature flower = eye in the middle), row 2 = the other three.
const SIX = {
  country_bloom: ['clover', 'daisy', 'buttercup', 'tulip', 'sunflower', 'pumpkin'],
  frost_orchard: ['frost_snowdrop', 'silver_aconite', 'clover', 'daisy', 'tulip', 'sunflower'],
  lantern_meadow: ['clover', 'buttercup', 'daisy', 'tulip', 'silver_aconite', 'sunflower'],
  amber_canopy: ['tulip', 'sunflower', 'pumpkin', 'clover', 'daisy', 'buttercup'],
  moonlit_warren: ['silver_aconite', 'frost_snowdrop', 'tulip', 'clover', 'daisy', 'sunflower'],
  coral_tide: ['daisy', 'tulip', 'buttercup', 'clover', 'sunflower', 'pumpkin'],
  starfall_glade: ['silver_aconite', 'daisy', 'sunflower', 'clover', 'tulip', 'frost_snowdrop'],
  ember_fen: ['buttercup', 'pumpkin', 'tulip', 'clover', 'silver_aconite', 'daisy']
};
// card px: [centre x, top, disc]. Eye 220, others 180, gap 48, row-1 sides drop 26, row 2 at 552.
// Row 2 spans x 198–834, clear of the arrows (x ≤ 148 / ≥ 884); names end ≤ 826 < STATUS_TOP 830.
const ROSTER6 = [[268, 256, 180], [516, 230, 220], [764, 256, 180], [288, 552, 180], [516, 552, 180], [744, 552, 180]];
const VEIL = '#E3D9CC'; // = locked-basket grey on the field
const REVEAL = { MS: 300, STAGGER: 40 };
const SCENES = {
  free_active: { label: '1 · Free · season you play', tab: 'free', idx: 2, coins: 320, stars: 14 },
  free_open: { label: '1b · Free · unlocked, not playing', tab: 'free', idx: 1, coins: 320, stars: 14 },
  free_locked: { label: '2 · Free · browsing locked · Play = Back', tab: 'free', idx: 3, coins: 320, stars: 14 },
  free_unlock: { label: '3a · Free · next season ready to unlock', tab: 'free', idx: 3, coins: 1250, stars: 20 },
  premium_buy: { label: '4a · Premium · for sale', tab: 'premium', idx: 0, coins: 320, stars: 14 },
  premium_owned: { label: '4b · Premium · bought', tab: 'premium', idx: 1, coins: 320, stars: 14 },
  premium_soon: { label: '4c · Premium · Ember coming soon', tab: 'premium', idx: 3, coins: 320, stars: 14 }
};
// One source of truth — same numbers in godot/home_v3_export.json and godot/ui_home_v3.gd.
const T = { OPEN_MS: 560, CLOSE_MS: 440, SWAP_MS: 220, SNAP_MS: 180, SWIPE_MIN: 60, TAP_SLOP: 12, RUBBER: 40, SWAP_OFFSET: 90, SELECT_OUT: [0.02, 0.30], CONTENT_OUT: [0.02, 0.40], SELECT_LIFT: 24 };
const CARD = [24, 172, 1032, 1160], PAGE = [0, 0, 1080, 1633];
const BANDS = [0.32, 0.68];
const CARD_R = 48, CARD_B = 4, CARD_SH = 12;
const NAME0 = { top: 244, size: 80, ls: -0.015, cx: 540 }, NAME1 = { top: 36, size: 56, ls: -0.01, cx: 540 };
const PIP0 = { x: 425, y: 1027, s: 230, shL: 45, shB: 8, shW: 140, shH: 30 };
const PIP1 = { s: 190, shL: 35, shB: 6, shW: 120, shH: 26 };
const PIP_HOME = [756, 1404], PIP_ZONE = [151, 1306, 778, 131], PIP_WALKED = [300, 1330];
const PLAY0 = { x: 280, y: 1413, w: 520, h: 180, bw: 4, sy: 10, sa: 0.30, fs: 76, th: 30, tl: 48, ml: 8, gap: 24 };
const PLAY1 = { x: 324, y: 1461, w: 432, h: 140, bw: 3, sy: 8, sa: 0.28, fs: 64, th: 26, tl: 42, ml: 6, gap: 22 };
const INK = '#2D3436';
const clamp = v => Math.max(0, Math.min(1, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const lerp = (a, b, t) => a + (b - a) * t;
const win = (u, a, b) => clamp((u - a) / (b - a));
const f2 = v => (Math.round(v * 100) / 100).toString();

class Component extends DCLogic {
  state = this.fromScene();
  fromScene() {
    const sc = SCENES[this.props.scene] || SCENES.free_active;
    const tab = this.props.tab || sc.tab;
    return { tab, idx: tab === sc.tab ? sc.idx : (tab === 'free' ? 2 : 0), coins: sc.coins, stars: sc.stars, active: 'lantern_meadow', unlocked: ['country_bloom', 'frost_orchard', 'lantern_meadow'], owned: ['coral_tide'], u: 0, moving: false, swap: 1, dir: 0, dragX: 0, toast: '', feet: PIP_HOME, from: null };
  }
  _alive = true;
  // warm: mount the (hidden) field shortly after load so the first open frame has the meadow; Specs thumbnails pass warm=false.
  componentDidMount() { this._alive = true; if (this.props.warm !== false) this._warm = setTimeout(() => this._alive && this.setState({ warm: true }), 300); }
  componentDidUpdate(pp) { if (pp.scene !== this.props.scene || pp.tab !== this.props.tab) { this.stopAll(); this.setState(this.fromScene()); } }
  componentWillUnmount() { this._alive = false; this.stopAll(); this.detach(); }
  stopAll() { clearTimeout(this._raf); clearTimeout(this._sraf); clearTimeout(this._draf); clearTimeout(this._rvraf); this.stopWalk(); clearTimeout(this._tt); }
  frozen() { return this.props.openT != null || this.props.closeT != null; }
  busy() { const s = this.state; return this.frozen() || s.moving || s.swap < 1 || !!this._drag; }
  // setTimeout ticks (not rAF) so the mock also runs in hidden / background previews.
  run(slot, ms, fn, done) {
    clearTimeout(this[slot]);
    const t0 = performance.now();
    const step = () => {
      if (!this._alive) return;
      const k = clamp((performance.now() - t0) / ms);
      if (slot === '_wraf' && (this.state.moving || this.state.u < 1)) return;
      fn(k);
      if (k < 1) this[slot] = setTimeout(step, 16); else if (done) done();
    };
    this[slot] = setTimeout(step, 0);
  }
  toast(msg) { this.setState({ toast: msg }); clearTimeout(this._tt); this._tt = setTimeout(() => this.setState({ toast: '' }), 1400); }
  swapTo(tab, idx, dirOverride) {
    if (this.busy()) return;
    const s = this.state;
    if (tab === s.tab && idx === s.idx) return;
    const dir = dirOverride != null ? dirOverride : (tab !== s.tab ? 0 : Math.sign(idx - s.idx));
    this.setState({ tab, idx, dir, swap: 0, dragX: 0 });
    this.run('_sraf', T.SWAP_MS, k => this.setState({ swap: k }));
  }
  open(key) {
    if (this.busy() || this.state.u > 0) return;
    this.setState({ active: key, moving: true, feet: PIP_HOME, from: null, dragX: 0 });
    this.run('_raf', T.OPEN_MS, k => this.setState({ u: k }), () => { this.setState({ moving: false, u: 1 }); this.walk(); });
  }
  close() {
    const s = this.state;
    if (this.busy() || s.u < 1) return;
    this.stopWalk();
    const tab = FREE.includes(s.active) ? 'free' : 'premium';
    this.setState({ tab, idx: (tab === 'free' ? FREE : PREM).indexOf(s.active), swap: 1, dir: 0, dragX: 0, moving: true, from: s.feet });
    this.run('_raf', T.CLOSE_MS, k => this.setState({ u: 1 - k }), () => this.setState({ moving: false, u: 0, feet: PIP_HOME, from: null }));
  }
  walk() {
    if (!this._alive || this.frozen()) return;
    const s = this.state;
    if (s.u < 1 || s.moving) return;
    const [x0, y0] = s.feet;
    let d = PIP_HOME;
    for (let i = 0; i < 8; i++) {
      d = [PIP_ZONE[0] + Math.random() * PIP_ZONE[2], PIP_ZONE[1] + Math.random() * PIP_ZONE[3]];
      if (Math.hypot(d[0] - x0, d[1] - y0) >= 80) break;
    }
    const ms = Math.max(2.2, Math.min(5.5, Math.hypot(d[0] - x0, d[1] - y0) / 70)) * 1000;
    this.run('_wraf', ms, k => {
      if (this.state.moving || this.state.u < 1) return;
      const e = 0.5 - Math.cos(Math.PI * k) / 2;
      this.setState({ feet: [lerp(x0, d[0], e), lerp(y0, d[1], e)] });
    }, () => { this._wt = setTimeout(() => this.walk(), 700 + Math.random() * 1800); });
  }
  stopWalk() { clearTimeout(this._wraf); clearTimeout(this._wt); }
  detach() {
    if (this._mv) { window.removeEventListener('pointermove', this._mv); window.removeEventListener('pointerup', this._up); window.removeEventListener('pointercancel', this._up); }
    this._mv = this._up = null;
  }
  cardDown(e) {
    this._suppress = false;
    if (this.busy() || this.state.u > 0) return;
    if (e.target && e.target.closest && e.target.closest('[data-btn]')) return;
    const el = e.currentTarget;
    const sc = el.getBoundingClientRect().width / (el.offsetWidth || 1) || 1;
    this._drag = { x: e.clientX, sc, dx: 0, moved: false };
    this._mv = ev => {
      const d = this._drag; if (!d) return;
      d.dx = (ev.clientX - d.x) / d.sc;
      if (!d.moved && Math.abs(d.dx) < T.TAP_SLOP) return;
      d.moved = true;
      const s = this.state;
      const edge = (d.dx > 0 && s.idx === 0) || (d.dx < 0 && s.idx === 3);
      this.setState({ dragX: edge ? Math.sign(d.dx) * Math.min(Math.abs(d.dx) * 0.35, T.RUBBER) : d.dx });
    };
    this._up = () => {
      const d = this._drag; this.detach(); this._drag = null;
      if (!d || !d.moved) return;
      this._suppress = true;
      const s = this.state;
      if (d.dx <= -T.SWIPE_MIN && s.idx < 3) return this.swapTo(s.tab, s.idx + 1, 1);
      if (d.dx >= T.SWIPE_MIN && s.idx > 0) return this.swapTo(s.tab, s.idx - 1, -1);
      const x0 = s.dragX;
      this.run('_draf', T.SNAP_MS, k => this.setState({ dragX: x0 * (1 - ease(k)) }));
    };
    window.addEventListener('pointermove', this._mv);
    window.addEventListener('pointerup', this._up);
    window.addEventListener('pointercancel', this._up);
  }
  rgb(h) { return [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); }
  hx(a) { return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
  tones(h) { const g = this.rgb(h); return { ground: h, sky: this.hx(g.map(v => v + (255 - v) * .30)), near: this.hx(g.map(v => v * .93)), page: this.hx(g.map(v => v + (255 - v) * .55)) }; }
  renderVals() {
    const p = this.props, s = this.state;
    const sc = SCENES[p.scene] || SCENES.free_active;
    let u = s.u, from = s.from;
    if (p.openT != null) { u = clamp(p.openT); from = null; }
    else if (p.closeT != null) { u = 1 - clamp(p.closeT); from = p.pipWalked ? PIP_WALKED : PIP_HOME; }
    const e = ease(u);
    const inField = u >= 1, idle = u <= 0;
    const list = s.tab === 'free' ? FREE : PREM;
    const key = list[s.idx], se = SEASONS[key], tn = this.tones(se.g);
    const premium = s.tab === 'premium';
    const playable = premium ? s.owned.includes(key) : s.unlocked.includes(key);
    const isActive = key === s.active;
    const prevKey = !premium && s.idx > 0 ? FREE[s.idx - 1] : null;
    const isNext = !premium && !playable && prevKey && s.unlocked.includes(prevKey);
    const ready = isNext && s.coins >= 500 && s.stars >= 20;
    const status = isActive ? 'active' : playable ? (premium ? 'owned' : 'open') : premium ? (PRICE[key] ? 'buy' : 'soon') : ready ? 'unlock' : 'locked';
    const dim = status === 'soon';

    const sw = ease(s.swap);
    const ox = idle ? s.dir * T.SWAP_OFFSET * (1 - sw) + s.dragX : 0;
    const swapA = idle ? 0.4 + 0.6 * sw : 1;
    const cr = CARD.map((v, i) => lerp(v, PAGE[i], e));
    const rad = lerp(CARD_R, 0, e), bw = lerp(CARD_B, 0, e), sh = lerp(CARD_SH, 0, e);
    const b1 = Math.round(cr[3] * BANDS[0]), b2 = Math.round(cr[3] * BANDS[1]);
    const selOut = win(u, T.SELECT_OUT[0], T.SELECT_OUT[1]);
    const contentA = 1 - win(u, T.CONTENT_OUT[0], T.CONTENT_OUT[1]);

    const veiled = status === 'locked' || status === 'unlock';
    const rv = s.reveal && s.reveal.key === key ? s.reveal.t : null;
    const roster = SIX[key].map((f, i) => {
      const [cx, top, d] = ROSTER6[i];
      const veil = veiled ? 1 : rv != null ? 1 - clamp((rv - i * REVEAL.STAGGER) / REVEAL.MS) : 0;
      const miss = playable && veil <= 0 && (MISSING[key] || []).includes(f);
      return {
        wrap: 'position:absolute;left:' + (cx - d / 2) + 'px;top:' + top + 'px;width:' + d + 'px;display:flex;flex-direction:column;align-items:center;gap:18px',
        disc: 'position:relative;width:' + d + 'px;height:' + d + 'px;flex:0 0 auto;box-sizing:border-box;border-radius:50%;background:' + (miss ? 'rgba(255,248,240,.55)' : '#FFF8F0') + ';border:4px ' + (miss ? 'dashed' : 'solid') + ' ' + INK + ';display:grid;place-items:center;overflow:hidden',
        src: 'flowers/ph_' + f + '.svg',
        art: 'width:' + Math.round(d * .82) + 'px;height:' + Math.round(d * .82) + 'px;display:' + (veil >= 1 ? 'none' : 'block') + ';' + (miss ? 'filter:brightness(0);opacity:.28' : dim ? 'opacity:.5' : ''),
        veil: 'position:absolute;left:0;top:0;right:0;bottom:0;background:' + VEIL + ';' + (veil > 0 ? 'opacity:' + veil.toFixed(3) : 'display:none'),
        missing: miss, name: NAMES[f]
      };
    });
    const at = FREE.includes(s.active) ? 'free' : 'premium';
    const activeIdx = (at === 'free' ? FREE : PREM).indexOf(s.active);
    const dots = list.map((k, i) => {
      const cur = i === s.idx, here = at === s.tab && i === activeIdx;
      return { style: 'height:24px;border-radius:12px;box-sizing:border-box;flex:0 0 auto;width:' + (cur ? 64 : 24) + 'px;background:' + (here ? '#FFB88C' : cur ? INK : 'rgba(45,52,54,.28)') + ';border:' + (here ? '3px solid ' + INK : '0') };
    });

    const F = from || (inField ? s.feet : PIP_HOME);
    const pS = lerp(PIP0.s, PIP1.s, e);
    const pX = lerp(PIP0.x, F[0] - PIP1.s / 2, e) + ox, pY = lerp(PIP0.y, F[1] - PIP1.s, e);
    const P = {}; Object.keys(PLAY0).forEach(k => { P[k] = lerp(PLAY0[k], PLAY1[k], e); });
    const need = ok => 'height:120px;box-sizing:border-box;border-radius:60px;border:4px solid ' + INK + ';display:flex;align-items:center;gap:14px;padding:0 36px 0 24px;background:' + (ok ? '#A8E6CF' : '#FFF8F0');
    const tabBase = 'width:508px;height:108px;box-sizing:border-box;border-radius:54px;display:flex;align-items:center;justify-content:center;gap:16px;cursor:pointer;';
    const on = 'border:3px solid ' + INK + ';box-shadow:0 6px 0 rgba(26,26,20,.22);';
    const act = SEASONS[s.active];
    const guard = fn => ev => { if (ev && ev.stopPropagation) ev.stopPropagation(); if (this.busy() || !idle) return; fn(); };
    const rect = r => 'position:absolute;left:' + f2(r[0]) + 'px;top:' + f2(r[1]) + 'px;width:' + f2(r[2]) + 'px;height:' + f2(r[3]) + 'px;';
    return {
      sceneLabel: inField ? '6 · Field · ' + act.n : u > 0 ? '5 · Transition' : sc.label,
      coinsText: s.coins.toLocaleString('en-US'),
      pageStyle: 'flex:0 0 1633px;height:1633px;position:relative;overflow:hidden;background:' + tn.page,
      tabsStyle: 'position:absolute;left:24px;top:24px;width:1032px;height:124px;box-sizing:border-box;padding:8px;border-radius:62px;background:rgba(45,52,54,.10);display:flex;opacity:' + (1 - selOut).toFixed(3) + ';transform:translateY(' + f2(-T.SELECT_LIFT * selOut) + 'px);' + (idle ? '' : 'pointer-events:none;') + (inField ? 'visibility:hidden' : ''),
      freeTabStyle: tabBase + (premium ? 'background:transparent;border:3px solid transparent' : 'background:#FFF8F0;' + on),
      premTabStyle: tabBase + (premium ? 'background:#FFD56B;' + on : 'background:transparent;border:3px solid transparent'),
      onFree: guard(() => premium && this.swapTo('free', at === 'free' ? activeIdx : 0)),
      onPremium: guard(() => !premium && this.swapTo('premium', at === 'premium' ? activeIdx : 0)),
      cardStyle: rect([cr[0] + ox, cr[1], cr[2], cr[3]]) + 'box-sizing:border-box;overflow:hidden;border-radius:' + f2(rad) + 'px;box-shadow:0 ' + f2(sh) + 'px 0 rgba(26,26,20,.26);pointer-events:auto;cursor:' + (playable ? 'pointer' : 'default') + ';touch-action:pan-y;user-select:none;opacity:' + swapA.toFixed(3) + ';' + (inField ? 'display:none' : ''),
      skyStyle: 'position:absolute;left:0;top:0;right:0;height:' + b1 + 'px;background:' + tn.sky,
      groundStyle: 'position:absolute;left:0;top:' + b1 + 'px;right:0;height:' + (b2 - b1) + 'px;background:' + tn.ground,
      nearStyle: 'position:absolute;left:0;top:' + b2 + 'px;right:0;bottom:0;background:' + tn.near,
      contentStyle: 'position:absolute;left:50%;top:0;width:1032px;height:1160px;margin-left:-516px;opacity:' + contentA.toFixed(3) + ';' + (contentA <= 0 ? 'visibility:hidden' : ''),
      premium,
      // one lock per card: on the flower block when locked; in the unlock state the Unlock button carries it
      blockLock: status === 'locked',
      roster,
      stOpen: status === 'open', stLocked: status === 'locked', stUnlock: status === 'unlock', stBuy: status === 'buy', stOwned: status === 'owned', stSoon: status === 'soon',
      needCoinStyle: need(s.coins >= 500), needStarStyle: need(s.stars >= 20),
      coinNeed: Math.min(s.coins, 500) + ' / 500', starNeed: Math.min(s.stars, 20) + ' / 20',
      prevArt: prevKey ? 'flowers/ph_' + SEASONS[prevKey].r[1] + '.svg' : '',
      price: PRICE[key] || '',
      onCardDown: ev => this.cardDown(ev),
      onCard: () => { if (this._suppress) { this._suppress = false; return; } if (this.busy() || !idle) return; if (playable) this.open(key); },
      onGate: guard(() => this.open(key)),
      onUnlock: guard(() => {
        const total = REVEAL.MS + 5 * REVEAL.STAGGER;
        this.setState({ unlocked: s.unlocked.concat(key), coins: s.coins - 500, reveal: { key, t: 0 } });
        this.run('_rvraf', total, k => this.setState({ reveal: { key, t: k * total } }), () => this.setState({ reveal: null }));
        this.toast('Unlocked');
      }),
      onBuy: guard(() => { this.setState({ owned: s.owned.concat(key) }); this.toast('Store sheet'); }),
      fieldMounted: u > 0 || !!s.warm,
      clipStyle: rect(cr) + 'overflow:hidden;border-radius:' + f2(rad) + 'px;pointer-events:' + (inField ? 'auto' : 'none') + (u > 0 ? '' : ';visibility:hidden'),
      fieldInnerStyle: 'position:absolute;left:' + f2(-cr[0]) + 'px;top:' + f2(-cr[1]) + 'px;width:1080px;height:1633px',
      activeKey: s.active,
      fieldScene: p.fieldScene || 'gift',
      u,
      noBands: !inField,
      onSeasons: () => this.close(),
      edgeStyle: rect([cr[0] + ox, cr[1], cr[2], cr[3]]) + 'box-sizing:border-box;border-radius:' + f2(rad) + 'px;border:' + f2(bw) + 'px solid ' + INK + ';pointer-events:none;opacity:' + swapA.toFixed(3) + ';' + (inField ? 'display:none' : ''),
      seasonName: u > 0 ? act.n : se.n,
      nameStyle: 'position:absolute;left:' + f2(ox + lerp(NAME0.cx, NAME1.cx, e) - 540) + 'px;top:' + f2(lerp(NAME0.top, NAME1.top, e)) + 'px;width:1080px;text-align:center;font-weight:900;font-size:' + f2(lerp(NAME0.size, NAME1.size, e)) + 'px;line-height:1;font-family:Nunito,system-ui,sans-serif;letter-spacing:' + lerp(NAME0.ls, NAME1.ls, e).toFixed(4) + 'em;color:#1A1A14;white-space:nowrap;pointer-events:none;opacity:' + swapA.toFixed(3),
      showPip: status === 'active' || u > 0,
      pipStyle: rect([pX, pY, pS, pS]) + 'pointer-events:none;opacity:' + swapA.toFixed(3),
      pipShadowStyle: 'position:absolute;left:' + f2(lerp(PIP0.shL, PIP1.shL, e)) + 'px;bottom:' + f2(lerp(PIP0.shB, PIP1.shB, e)) + 'px;width:' + f2(lerp(PIP0.shW, PIP1.shW, e)) + 'px;height:' + f2(lerp(PIP0.shH, PIP1.shH, e)) + 'px;border-radius:999px;background:rgba(26,26,20,.14)',
      playOpens: isActive || !idle,
      playReturns: !isActive && idle,
      playStyle: rect([P.x, P.y, P.w, P.h]) + 'box-sizing:border-box;border-radius:' + f2(P.h / 2) + 'px;background:#FFB88C;border:' + f2(P.bw) + 'px solid ' + INK + ';box-shadow:0 ' + f2(P.sy) + 'px 0 rgba(26,26,20,' + P.sa.toFixed(3) + ');display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;z-index:3',
      playRowStyle: 'display:flex;align-items:center;gap:' + f2(P.gap) + 'px',
      triStyle: 'width:0;height:0;border-top:' + f2(P.th) + 'px solid transparent;border-bottom:' + f2(P.th) + 'px solid transparent;border-left:' + f2(P.tl) + 'px solid ' + INK + ';margin-left:' + f2(P.ml) + 'px',
      playTextStyle: 'font-weight:900;font-size:' + f2(P.fs) + 'px;line-height:1;font-family:Nunito,system-ui,sans-serif;color:' + INK,
      backDiscStyle: 'width:104px;height:104px;box-sizing:border-box;border-radius:52px;background:' + act.g + ';border:4px solid ' + INK + ';display:grid;place-items:center;overflow:hidden',
      activeArt: 'flowers/ph_' + act.r[1] + '.svg',
      onPlay: ev => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        if (this.busy()) return;
        if (inField) return this.toast('Run starts');
        if (isActive) this.open(key); else this.swapTo(at, activeIdx);
      },
      navStyle: 'position:absolute;left:24px;top:172px;width:1032px;height:1300px;pointer-events:none;opacity:' + (1 - selOut).toFixed(3) + ';' + (selOut >= 1 || inField ? 'visibility:hidden' : ''),
      hasPrev: s.idx > 0, hasNext: s.idx < 3,
      onPrev: guard(() => this.swapTo(s.tab, s.idx - 1)), onNext: guard(() => this.swapTo(s.tab, s.idx + 1)),
      dots,
      toast: s.toast
    };
  }
}
</script>
