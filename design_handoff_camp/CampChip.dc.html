<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-layer="{{ layer }}" style="{{ rootStyle }}">
  <div data-layer="ChipRow" style="{{ rowStyle }}">
    <div data-layer="ArtFrame" style="{{ frameStyle }}">
      <div data-layer="ArtWell" style="{{ wellStyle }}"></div>
      <img data-layer="FlowerArt" src="{{ artSrc }}" alt="" style="{{ artStyle }}" />
    </div>
    <div data-layer="ChipBody" style="{{ bodyStyle }}">
      <div data-layer="NameBlock" style="{{ nameBlockStyle }}">
        <div data-layer="ChipName" style="{{ nameStyle }}">{{ label }}</div>
        <div data-layer="RarityPips" style="{{ pipsStyle }}">{{ pips }}</div>
      </div>
      <div data-layer="ReservedBadge" style="{{ badgeStyle }}">
        <img src="icons/icon_lock.svg" alt="" style="{{ lockStyle }}" />
        <div style="{{ badgeTextStyle }}">{{ badgeText }}</div>
      </div>
      <div data-layer="PillRow" style="{{ pillRowStyle }}">
        <div data-layer="CountPill" style="{{ countStyle }}">
          <img src="{{ countIcon }}" alt="" style="{{ countIconStyle }}" />
          <div style="{{ countNumStyle }}">{{ count }}</div>
        </div>
        <div data-layer="PricePill" style="{{ priceStyle }}">
          <img src="icons/icon_coin.svg" alt="" style="{{ coinStyle }}" />
          <div style="{{ priceNumStyle }}">{{ price }}</div>
          <div style="{{ eachStyle }}">each</div>
        </div>
      </div>
    </div>
  </div>
  <div data-layer="SelectMark" style="{{ markStyle }}"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:489,&quot;height&quot;:176},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;seed&quot;,&quot;flower&quot;],&quot;default&quot;:&quot;seed&quot;,&quot;tsType&quot;:&quot;'seed'|'flower'&quot;},&quot;rarity&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[1,2,3],&quot;default&quot;:1,&quot;tsType&quot;:&quot;1|2|3&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Meadow Clover&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;art&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;clover&quot;,&quot;daisy&quot;,&quot;buttercup&quot;,&quot;tulip&quot;,&quot;sunflower&quot;,&quot;pumpkin&quot;,&quot;frost_snowdrop&quot;,&quot;silver_aconite&quot;],&quot;default&quot;:&quot;clover&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:999,&quot;tsType&quot;:&quot;number&quot;},&quot;price&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:20,&quot;tsType&quot;:&quot;number&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;selected&quot;,&quot;pressed&quot;,&quot;disabled&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;reserved&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;atFloor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;have&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:0,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;},&quot;need&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:20,&quot;min&quot;:1,&quot;max&quot;:99,&quot;tsType&quot;:&quot;number&quot;},&quot;tint&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;frost&quot;,&quot;lantern&quot;,&quot;amber&quot;],&quot;default&quot;:&quot;frost&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;wide&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;w&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:489,&quot;min&quot;:300,&quot;max&quot;:996,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const RB = { 1: ['#B8D4F0', '#93AAC0'], 2: ['#E0C4FF', '#B39DCC'], 3: ['#FFE8B8', '#CCBA93'] };
const CREAM = '#FFF8F0', CREAM_EDGE = '#CBC2B6', WELL = '#22342A', WELL_EDGE = '#16211B';
const GOLD = '#FFD56B', GOLD_EDGE = '#D6A82F', PEACH = '#FFB88C', INK = '#2D3436';
const TINTS = { frost: ['#C5D5E8', '#9FB4CC', 'Frost Orchard'], lantern: ['#C9B8E0', '#A193B3', 'Lantern Meadow'], amber: ['#E8C48A', '#BA9D6E', 'Amber Canopy'] };
const NUN = 'Nunito,system-ui,sans-serif';

class Component extends DCLogic {
  rgb(h) { return [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); }
  hx(a) { return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
  sc(h, f) { return this.hx(this.rgb(h).map(v => v * f)); }
  tn(h, t) { return this.hx(this.rgb(h).map(v => v + (255 - v) * t)); }

  renderVals() {
    const p = this.props;
    const seed = (p.kind ?? 'seed') === 'seed';
    const r = Math.max(1, Math.min(3, p.rarity ?? 1));
    const st = p.state ?? 'idle';
    const res = !!p.reserved;
    const floor = !!p.atFloor;
    const wide = !!p.wide;
    const base = RB[r];
    const tint = TINTS[p.tint ?? 'frost'];

    let bg = base[0], edge = base[1], ink = INK, bw = 2, pad = 14, lift = 0, shadow = '0 6px 14px rgba(20,26,22,.24)';
    if (st === 'selected') { bg = this.tn(base[0], 0.14); edge = PEACH; bw = 5; pad = 11; lift = -3; shadow = '0 10px 18px rgba(20,26,22,.30)'; }
    else if (st === 'pressed') { bg = this.sc(base[0], 0.92); edge = PEACH; bw = 5; pad = 11; shadow = '0 3px 7px rgba(20,26,22,.26)'; }
    else if (st === 'disabled') { bg = '#E4E4E0'; edge = '#B6B6B2'; ink = '#5C5C58'; shadow = '0 4px 9px rgba(20,26,22,.16)'; }

    const w = p.w ?? (wide ? 996 : 491);
    const h = (res && !wide) ? 244 : 176;
    const rootStyle = ['position:relative;box-sizing:border-box;flex:0 0 auto',
      'width:' + w + 'px;height:' + h + 'px;border-radius:20px',
      'background:' + bg + ';border:' + bw + 'px solid ' + edge,
      'padding:' + pad + 'px;display:flex;flex-direction:column',
      'box-shadow:' + shadow, 'transform:translateY(' + lift + 'px)',
      'font-family:' + NUN, 'overflow:hidden'].join(';');

    const art = seed ? 66 : 70;
    const frameStyle = ['position:relative;flex:0 0 auto;box-sizing:border-box;width:104px;height:104px',
      'border-radius:' + (seed ? '50%' : '26px'),
      'background:' + (seed ? CREAM : GOLD),
      'border:3px solid ' + (seed ? CREAM_EDGE : GOLD_EDGE),
      'display:grid;place-items:center'].join(';');

    return {
      layer: seed ? 'SeedChip' : 'FlowerChip',
      label: p.label ?? 'Meadow Clover',
      count: String(p.count ?? 0),
      price: String(p.price ?? 1),
      pips: '★'.repeat(r) + '☆'.repeat(3 - r),
      artSrc: 'flowers/ph_' + (p.art ?? 'clover') + '.svg',
      countIcon: seed ? 'icons/icon_seed.svg' : 'icons/icon_crystal.svg',
      rootStyle, frameStyle,
      wellStyle: 'position:absolute;inset:10px;box-sizing:border-box;border-radius:' + (seed ? '50%' : '18px') + ';background:' + WELL + ';border:2px solid ' + WELL_EDGE,
      rowStyle: 'flex:1;min-height:0;display:flex;align-items:center;gap:14px',
      artStyle: 'position:relative;display:block;width:' + art + 'px;height:' + art + 'px',
      bodyStyle: 'flex:1;min-width:0;display:flex;gap:' + (wide ? 20 : 6) + 'px;' +
        (wide ? 'flex-direction:row;align-items:center' : 'flex-direction:column;justify-content:center;gap:6px'),
      nameBlockStyle: (wide ? 'flex:0 1 300px' : 'flex:1') + ';min-width:0;display:flex;flex-direction:column;gap:4px',
      nameStyle: 'font:800 40px/1.05 ' + NUN + ';color:' + ink + ';white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
      pipsStyle: 'font:800 32px/1 ' + NUN + ';letter-spacing:.04em;color:' + ink,
      badgeStyle: res
        ? 'flex:0 0 auto;box-sizing:border-box;height:56px;padding:0 16px;border-radius:14px;background:' + (floor ? '#FFE8B8' : tint[0]) + ';border:' + (floor ? '3px solid ' + GOLD_EDGE : '2px solid ' + tint[1]) + ';display:flex;align-items:center;gap:10px;' + (wide ? '' : 'align-self:stretch;')
        : 'display:none',
      lockStyle: 'width:32px;height:32px;display:block;flex:0 0 auto',
      badgeTextStyle: 'font:800 ' + (floor ? 34 : 38) + 'px/1 ' + NUN + ';color:#1A1A14;white-space:nowrap;overflow:hidden;text-overflow:ellipsis',
      badgeText: floor
        ? 'Hold stops here'
        : 'Kept · ' + (p.have ?? 12) + ' / ' + (p.need ?? 20),
      pillRowStyle: 'flex:0 0 auto;display:flex;gap:10px;align-items:center',
      countStyle: 'box-sizing:border-box;height:62px;padding:0 14px;border-radius:14px;background:rgba(255,248,240,.70);border:2px solid rgba(45,52,54,.20);display:flex;align-items:center;gap:10px',
      countIconStyle: 'width:32px;height:32px;display:block;flex:0 0 auto',
      countNumStyle: 'font:900 48px/1 ' + NUN + ';font-variant-numeric:tabular-nums;color:' + ink,
      priceStyle: 'box-sizing:border-box;height:62px;padding:0 12px;border-radius:14px;background:#FFE8B8;border:2px solid ' + GOLD_EDGE + ';display:flex;align-items:center;gap:8px',
      coinStyle: 'width:34px;height:34px;display:block;flex:0 0 auto',
      priceNumStyle: 'font:900 46px/1 ' + NUN + ';font-variant-numeric:tabular-nums;color:' + INK,
      eachStyle: 'font:700 30px/1 ' + NUN + ';color:' + INK,
      markStyle: (st === 'selected' || st === 'pressed')
        ? 'position:absolute;inset:0;border-radius:15px;border:4px solid rgba(45,52,54,.55);pointer-events:none'
        : 'display:none'
    };
  }
}
</script>
</body>
</html>
