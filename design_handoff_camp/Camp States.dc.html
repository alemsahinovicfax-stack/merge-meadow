<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
body { margin: 0; background: #1A241E; }
a { color: #FFB88C; text-decoration: none; border-bottom: 1px solid rgba(255,184,140,.45); }
a:hover { color: #FFD56B; border-bottom-color: rgba(255,213,107,.6); }
</style>
</helmet>
<section style="box-sizing:border-box;width:2900px;padding:72px 80px 110px;display:flex;flex-direction:column;gap:48px;background:#1A241E;font-family:Nunito,system-ui,sans-serif;color:#FFF8F0">

  <div style="display:flex;flex-direction:column;gap:16px;max-width:1600px">
    <div style="font:800 22px/1 Nunito,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,248,240,.55)">Camp redesign · required states (§4.1)</div>
    <div style="font:900 58px/1.05 Nunito,system-ui,sans-serif">Every state the page has to survive</div>
    <div style="display:flex;gap:20px;margin-top:8px">
      <a href="Camp%20Redesign.dc.html" style="box-sizing:border-box;height:74px;padding:0 28px;border-radius:20px;background:rgba(255,248,240,.10);border:2px solid rgba(255,248,240,.30);display:flex;align-items:center;font:800 28px/1 Nunito,system-ui,sans-serif;color:#FFF8F0">← Two directions</a>
      <a href="Camp%20Specs.dc.html" style="box-sizing:border-box;height:74px;padding:0 28px;border-radius:20px;background:rgba(255,248,240,.10);border:2px solid rgba(255,248,240,.30);display:flex;align-items:center;font:800 28px/1 Nunito,system-ui,sans-serif;color:#FFF8F0">Chip · Trade · Season specs →</a>
    </div>
  </div>

  <div style="display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start">
    <sc-for list="{{ states }}" as="f" hint-placeholder-count="5">
      <div id="{{ f.id }}" style="display:flex;flex-direction:column;gap:16px;flex:0 0 auto">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="box-sizing:border-box;height:44px;min-width:44px;padding:0 14px;border-radius:12px;background:rgba(255,184,140,.9);display:grid;place-items:center;font:900 24px/1 Nunito,system-ui,sans-serif;color:#2D3436">{{ f.id }}</div>
          <div style="font:900 32px/1 Nunito,system-ui,sans-serif">{{ f.title }}</div>
        </div>
        <div style="font:700 23px/1.35 Nunito,system-ui,sans-serif;color:rgba(255,248,240,.72);width:540px;height:96px;text-wrap:pretty">{{ f.note }}</div>
        <div style="width:540px;height:960px;overflow:hidden;border-radius:22px;box-shadow:0 18px 44px rgba(0,0,0,.42)">
          <div style="width:1080px;height:1920px;transform:scale(.5);transform-origin:top left">
            <dc-import name="CampScreen" dir="{{ f.dir }}" tab="{{ f.tab }}" seed-set="{{ f.seedSet }}" flower-set="{{ f.flowerSet }}" season="{{ f.season }}" trade-state="{{ f.tradeState }}" sel="{{ f.sel }}" coins="{{ f.coins }}" hint-size="1080px,1920px"></dc-import>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
class Component extends DCLogic {
  renderVals() {
    return {
      states: [
        {
          id: '1b-1', title: 'All free seasons unlocked',
          note: 'No next season: the hero disappears and the list grows into the space. Two blocks, nothing else moves.',
          dir: 'tabs', tab: 'seeds', seedSet: 'six', flowerSet: 'four', season: 'none', tradeState: 'idle', sel: 0, coins: '12,450'
        },
        {
          id: '1b-2', title: 'Empty bag',
          note: 'Seeds tab with nothing in it: what seeds are for, and the one action that fixes it. Trade goes disabled, not hidden.',
          dir: 'tabs', tab: 'seeds', seedSet: 'none', flowerSet: 'four', season: 'short', tradeState: 'idle', sel: 0, coins: '320'
        },
        {
          id: '1b-3', title: 'Empty stash',
          note: 'Flowers tab before the first tier-3 merge. The tab still shows 0 so the player knows where it went.',
          dir: 'tabs', tab: 'flowers', seedSet: 'six', flowerSet: 'none', season: 'short', tradeState: 'idle', sel: 0, coins: '320'
        },
        {
          id: '1b-4', title: '20 types',
          note: 'Long list: eight chips visible, the count on the tab, a drag-to-scroll hint pinned to the bottom of the list. Longest name tested — Paper Lantern Bloom.',
          dir: 'tabs', tab: 'seeds', seedSet: 'twenty', flowerSet: 'four', season: 'short', tradeState: 'idle', sel: 2, coins: '320'
        },
        {
          id: '1b-5', title: 'One type',
          note: 'A single seed type: the list does not stretch it, and the Trade bar still explains the rate.',
          dir: 'tabs', tab: 'seeds', seedSet: 'one', flowerSet: 'four', season: 'short', tradeState: 'idle', sel: 0, coins: '320'
        },
        {
          id: '1b-6', title: 'Hold stopped at the floor',
          note: 'Flowers tab, Harvest Pumpkin at the 20 Frost Orchard keeps: the hold ended itself, the strip names the season, the button offers single taps. Bar grows to 224 px and the list gives back a row.',
          dir: 'tabs', tab: 'flowers', seedSet: 'six', flowerSet: 'four', season: 'short', tradeState: 'holdstop', sel: 3, coins: '320'
        },
        {
          id: '1a-1', title: 'Shelves · two blocks',
          note: 'Same "all unlocked" case in direction 1a — both shelves grow, season strip gone.',
          dir: 'shelves', tab: 'seeds', seedSet: 'six', flowerSet: 'four', season: 'none', tradeState: 'idle', sel: 0, coins: '12,450'
        },
        {
          id: '1a-2', title: 'Shelves · empty stash',
          note: 'In 1a an empty Flowers shelf is visible without a tap, which is the direction\u2019s main advantage.',
          dir: 'shelves', tab: 'seeds', seedSet: 'six', flowerSet: 'none', season: 'short', tradeState: 'idle', sel: 0, coins: '320'
        }
      ]
    };
  }
}
</script>
</body>
</html>
