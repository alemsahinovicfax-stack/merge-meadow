<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-layer="FlowerPortrait" data-type="{{ type }}" style="position:relative;flex:0 0 auto;width:{{ d }}px;height:{{ d }}px;box-sizing:border-box;border-radius:50%;background:#FFF8F0;border:4px solid #2D3436;overflow:hidden">
  <sc-if value="{{ isSvg }}" hint-placeholder-val="{{ false }}">
    <svg data-layer="FlowerArt" viewBox="{{ vb }}" width="{{ inner }}" height="{{ inner }}" style="position:absolute;left:0;top:0;display:block;opacity:{{ artA }}">
      <line x1="0" y1="12" x2="0" y2="28" stroke="#599E52" stroke-width="5"></line>
      <circle cx="-16" cy="-6" r="10" fill="{{ crystal }}"></circle>
      <circle cx="16" cy="-6" r="10" fill="{{ crystal }}"></circle>
      <circle cx="0" cy="-18" r="10" fill="{{ crystal }}"></circle>
      <circle cx="0" cy="6" r="10" fill="{{ crystal }}"></circle>
      <circle cx="0" cy="-8" r="10" fill="#FFF2BF"></circle>
      <circle cx="0" cy="-8" r="14" fill="none" stroke="{{ ring }}" stroke-width="3"></circle>
      <sc-if value="{{ sparkle }}" hint-placeholder-val="{{ false }}">
        <circle cx="-20" cy="-18" r="3" fill="#FFFFFF" fill-opacity="0.85"></circle>
        <circle cx="20" cy="-18" r="3" fill="#FFFFFF" fill-opacity="0.85"></circle>
        <circle cx="0" cy="14" r="3" fill="#FFFFFF" fill-opacity="0.85"></circle>
      </sc-if>
    </svg>
  </sc-if>
  <sc-if value="{{ isImg }}" hint-placeholder-val="{{ false }}">
    <img data-layer="FlowerArt" src="{{ src }}" alt="" style="position:absolute;left:{{ left }}px;top:{{ top }}px;width:{{ size }}px;height:{{ size }}px;max-width:none;display:block;opacity:{{ artA }}">
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:172,&quot;height&quot;:172},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;dim&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;type&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.p || {}, d = +(p.d || this.props.size || 148);
    return {
      type: this.props.type || p.type || '', d, inner: d - 8,
      isSvg: !!p.svg, isImg: p.svg === false,
      vb: p.vb || '0 0 1 1', crystal: p.crystal || '#D9B8F5', ring: p.ring || '#E4CCF8', sparkle: !!p.sparkle,
      src: p.src || '', left: p.left || 0, top: p.top || 0, size: p.size || 0,
      artA: this.props.dim ? 0.5 : 1
    };
  }
}
</script>
</body>
</html>
