<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #1A241E; }
  a { color: #FFB88C; text-decoration: none; border-bottom: 1px solid rgba(255,184,140,.45); }
  a:hover { color: #FFD56B; border-bottom-color: rgba(255,213,107,.6); }
</style>
</helmet>
<section style="box-sizing:border-box;width:3400px;padding:72px 80px 110px;display:flex;flex-direction:column;gap:48px;background:#1A241E;font-family:Nunito,system-ui,sans-serif;color:#FFF8F0">

  <div style="display:flex;flex-direction:column;gap:16px;max-width:1700px">
    <div style="font:800 22px/1 Nunito,system-ui,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,248,240,.55)">Home · smjer 1a Season Trail · P1.2, P1.3, P1.5</div>
    <div style="font:900 58px/1.05 Nunito,system-ui,sans-serif">Stanja koja ekran mora preživjeti</div>
    <div style="font:700 26px/1.4 Nunito,system-ui,sans-serif;color:rgba(255,248,240,.76);text-wrap:pretty">Svaki artboard je 1080 × 1920, ovdje prikazan na 50 %. Unlock storyboard (tri kadra) je na zasebnom listu.</div>
    <div style="display:flex;gap:20px;margin-top:8px;flex-wrap:wrap">
      <a href="Home%20Season%20Select.dc.html" style="box-sizing:border-box;height:74px;padding:0 28px;border-radius:20px;background:rgba(255,248,240,.10);border:2px solid rgba(255,248,240,.30);display:flex;align-items:center;font:800 28px/1 Nunito,system-ui,sans-serif;white-space:nowrap;color:#FFF8F0">← Dva smjera i geste</a>
      <a href="Home%20Unlock.dc.html" style="box-sizing:border-box;height:74px;padding:0 28px;border-radius:20px;background:rgba(232,196,74,.16);border:2px solid rgba(232,196,74,.7);display:flex;align-items:center;font:800 28px/1 Nunito,system-ui,sans-serif;white-space:nowrap;color:#FFD56B">Unlock storyboard →</a>
      <a href="Home%20Premium.dc.html" style="box-sizing:border-box;height:74px;padding:0 28px;border-radius:20px;background:rgba(255,248,240,.10);border:2px solid rgba(255,248,240,.30);display:flex;align-items:center;font:800 28px/1 Nunito,system-ui,sans-serif;white-space:nowrap;color:#FFF8F0">Premium →</a>
      <a href="Home%20Specs.dc.html" style="box-sizing:border-box;height:74px;padding:0 28px;border-radius:20px;background:rgba(255,248,240,.10);border:2px solid rgba(255,248,240,.30);display:flex;align-items:center;font:800 28px/1 Nunito,system-ui,sans-serif;white-space:nowrap;color:#FFF8F0">Spec sheet →</a>
    </div>
  </div>

  <div style="display:flex;gap:44px;flex-wrap:wrap;align-items:flex-start">
    <sc-for list="{{ boards }}" as="f" hint-placeholder-count="5">
      <div id="{{ f.id }}" style="display:flex;flex-direction:column;gap:16px;flex:0 0 auto;width:540px">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="{{ f.idStyle }}">{{ f.id }}</div>
          <div style="font:900 32px/1 Nunito,system-ui,sans-serif;white-space:nowrap">{{ f.title }}</div>
        </div>
        <div style="font:700 23px/1.35 Nunito,system-ui,sans-serif;color:rgba(255,248,240,.72);width:540px;height:150px;text-wrap:pretty">{{ f.note }}</div>
        <div style="width:540px;height:960px;overflow:hidden;border-radius:22px;box-shadow:0 18px 44px rgba(0,0,0,.42)">
          <div style="width:1080px;height:1920px;transform:scale(.5);transform-origin:top left">
            <dc-import name="HomeScreen" scene="{{ f.scene }}" dir="trail" hint-size="1080px,1920px"></dc-import>
          </div>
        </div>
      </div>
    </sc-for>
  </div>

</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const BOARDS = [
  { id: 'S1', tint: '#FFF6D6', scene: 'new', title: 'Novi igrač',
    note: 'Samo Country Bloom, otvorena i aktivna. Frost Orchard je next lock 0 / 500 i 0 / 20 i odmah kaže šta treba. Daily gift je skriven do kraja tutoriala (§2.8), pa ProgressIndicator (1 / 4) zauzima cijeli red. Tutorial hint stoji iznad Playa i nestaje poslije prvog runa.' },
  { id: 'S6', tint: '#D4A5FF', scene: 'overview', title: 'P1.7 — Pregled svih sezona',
    note: 'Zamjena za Browser: sve kartice zatvorene, svih 8 sezona u jednoj koloni — free put gore, red „Premium seasons" kao jedini razdjelnik, četiri premium kartice ispod (cijene i „Coming soon"). Isti SeasonStage, samo bez otvorene kartice; raspored ne pretpostavlja 4 + 4.' },
  { id: 'S5', tint: '#FFB88C', scene: 'allfree', title: 'Sve 4 free otključane',
    note: 'Nema next locka → poster nestaje, Amber Canopy je aktivna i otvorena, premium sekcija se penje u vidljivi dio kolone pa se prve dvije premium kartice vide bez skrola. Daily gift je u stanju „Back tomorrow".' }
];

class Component extends DCLogic {
  renderVals() {
    return {
      boards: BOARDS.map(b => Object.assign({}, b, {
        idStyle: 'box-sizing:border-box;height:44px;min-width:44px;padding:0 14px;border-radius:12px;background:' + b.tint +
          ';display:grid;place-items:center;font:900 24px/1 Nunito,system-ui,sans-serif;color:#1A1A14'
      }))
    };
  }
}
</script>
</body>
</html>
