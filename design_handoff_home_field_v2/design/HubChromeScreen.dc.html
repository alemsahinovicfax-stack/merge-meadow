<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>body{margin:0}a{color:#FFB88C}a:hover{color:#FFF8F0}</style>
</helmet>
<div data-layer="HubScreen" style="{{ rootStyle }}">

  <div data-layer="Header" style="flex:0 0 auto;position:relative;z-index:2;background:#2A2233;box-shadow:0 6px 14px rgba(20,14,26,.34)">
    <div style="height:var(--safeTop)"></div>
    <div style="height:140px;display:flex;align-items:center;gap:16px;padding:0 0 0 20px;box-sizing:border-box">
      <sc-for list="{{ chips }}" as="chip" hint-placeholder-count="3">
        <div data-layer="{{ chip.layer }}" style="width:296px;height:100px;flex:0 0 auto;box-sizing:border-box;border-radius:20px;display:flex;align-items:center;gap:10px;padding:0 18px 0 14px;background:#1F1926;border:2px solid rgba(255,248,240,.14)">
          <img src="{{ chip.icon }}" alt="" style="width:64px;height:64px;flex:0 0 auto">
          <div style="flex:1;min-width:0;text-align:right;font:800 48px/1 Nunito,system-ui,sans-serif;color:#FFF8F0;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap">{{ chip.value }}</div>
        </div>
      </sc-for>
      <div data-layer="SettingsSlot" style="width:124px;height:140px;flex:0 0 auto;display:flex;align-items:center;padding-left:4px;box-sizing:border-box">
        <div data-layer="SettingsButton" style="width:100px;height:100px;box-sizing:border-box;border-radius:20px;background:rgba(255,248,240,.10);border:2px solid rgba(255,248,240,.38);display:grid;place-items:center">
          <img src="icons/icon_settings_light.svg" alt="" style="width:56px;height:56px">
        </div>
      </div>
    </div>
    <div style="height:3px;background:rgba(255,248,240,.55)"></div>
  </div>

  <div data-layer="PageArea" style="flex:1;min-height:0;position:relative;padding:56px 48px;box-sizing:border-box;display:flex;flex-direction:column;gap:40px">
    <div style="height:210px;border-radius:26px;background:var(--ph)"></div>
    <div style="display:flex;gap:40px;flex:1;min-height:0">
      <div style="flex:1;border-radius:26px;background:var(--ph)"></div>
      <div style="flex:1;border-radius:26px;background:var(--ph)"></div>
    </div>
    <div style="height:180px;border-radius:26px;background:var(--ph)"></div>
    <div style="position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:14px;font:700 26px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--phInk);text-transform:uppercase">
      <div>{{ pageName }} · not designed</div>
      <div>page 1080 × {{ pageH }}</div>
    </div>
  </div>

  <div data-layer="Footer" style="flex:0 0 auto;position:relative;z-index:2;background:#2A2233;box-shadow:0 -6px 14px rgba(20,14,26,.34)">
    <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;right:0;top:-36px;display:flex;justify-content:center;z-index:3">
        <div data-layer="NavLockPill" style="display:flex;align-items:center;gap:14px;height:64px;padding:0 28px;border-radius:20px;background:#2A2233;border:2px solid rgba(232,196,74,.85);box-sizing:border-box">
          <img src="icons/icon_lock.svg" alt="" style="width:34px;height:34px;flex:0 0 auto">
          <div style="font:800 38px/1 Nunito,system-ui,sans-serif;letter-spacing:.04em;color:#E8C44A;white-space:nowrap">ROUND IN PROGRESS</div>
        </div>
      </div>
    </sc-if>
    <div style="height:3px;background:var(--topEdge)"></div>
    <div style="position:relative;height:141px;display:flex">
      <div data-layer="ActiveIndicator" style="{{ indicatorStyle }}"></div>
      <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="5">
        <div data-layer="{{ tab.layer }}" style="{{ tab.slotStyle }}">
          <div style="{{ tab.tileStyle }}">
            <img data-layer="TabIcon" src="{{ tab.icon }}" alt="{{ tab.label }}" style="{{ tab.iconStyle }}">
            <sc-if value="{{ tab.hasBadge }}" hint-placeholder-val="{{ false }}">
              <div data-layer="TabBadge" style="position:absolute;top:-8px;right:-6px;min-width:44px;height:44px;padding:0 10px;box-sizing:border-box;border-radius:22px;background:#FFCCD5;border:3px solid #2A2233;display:grid;place-items:center;font:800 26px/1 Nunito,system-ui,sans-serif;color:#2D3436">{{ tab.badge }}</div>
            </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="height:var(--safeBottom)"></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1920},&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shop&quot;,&quot;journal&quot;,&quot;home_carousel&quot;,&quot;home_field&quot;,&quot;camp&quot;,&quot;arena&quot;],&quot;default&quot;:&quot;home_carousel&quot;,&quot;tsType&quot;:&quot;'shop'|'journal'|'home_carousel'|'home_field'|'camp'|'arena'&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;normal&quot;,&quot;locked&quot;,&quot;badge&quot;,&quot;safe_area&quot;],&quot;default&quot;:&quot;normal&quot;,&quot;tsType&quot;:&quot;'normal'|'locked'|'badge'|'safe_area'&quot;,&quot;section&quot;:&quot;Screen&quot;},&quot;grayscale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Check&quot;},&quot;swipeAt&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:-1,&quot;min&quot;:-1,&quot;max&quot;:4,&quot;step&quot;:0.05,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Check&quot;},&quot;pressed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-1,&quot;min&quot;:-1,&quot;max&quot;:4,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Check&quot;},&quot;coins&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12,450&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Values&quot;},&quot;seeds&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;340&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Values&quot;},&quot;flowers&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;27&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Values&quot;},&quot;pageBg&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;badgeOn&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;badgeCount&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
const TABS = [['Tab_Shop', 'Shop', 'shop'], ['Tab_Journal', 'Journal', 'journal'], ['Tab_Home', 'Home', 'home'], ['Tab_Camp', 'Camp', 'camp'], ['Tab_Arena', 'Arena', 'arena']];
const PAGES = {
  shop: ['Shop', '#2E4733', 0], journal: ['Journal', '#FFF8F0', 1], home_carousel: ['Home · season pick', '#243329', 2],
  home_field: ['Home · season field', '#E6F2DB', 2], camp: ['Camp', '#2E4733', 3], arena: ['Arena', '#293D2E', 4]
};
class Component extends DCLogic {
  lum(hex) {
    const v = [1, 3, 5].map(i => { const c = parseInt(hex.substr(i, 2), 16) / 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  renderVals() {
    const p = this.props;
    const pg = PAGES[p.page ?? 'home_carousel'] || PAGES.home_carousel;
    const state = p.state ?? 'normal';
    const pageBg = p.pageBg || pg[1];
    const light = this.lum(pageBg) > 0.18;
    const locked = state === 'locked';
    const safe = state === 'safe_area';
    const safeTop = safe ? 90 : 0, safeBottom = safe ? 50 : 0;
    const active = locked ? 4 : pg[2];
    const pressed = p.pressed ?? -1;
    const swiping = p.swipeAt != null && p.swipeAt !== '' && !isNaN(+p.swipeAt) && +p.swipeAt >= 0;
    const pos = swiping ? +p.swipeAt : active;
    const badgeOn = state === 'badge' ? 1 : (p.badgeOn ?? -1);

    const rootStyle = [
      'width:1080px;height:1920px;flex:0 0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column',
      'background:' + pageBg, 'font-family:Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased',
      '--topEdge:' + (locked ? 'rgba(232,196,74,.85)' : 'rgba(255,248,240,.55)'),
      '--ph:' + (light ? 'rgba(45,52,54,.13)' : 'rgba(255,248,240,.13)'),
      '--phInk:' + (light ? 'rgba(45,52,54,.45)' : 'rgba(255,248,240,.45)'),
      '--safeTop:' + safeTop + 'px', '--safeBottom:' + safeBottom + 'px',
      p.grayscale ? 'filter:grayscale(1)' : ''
    ].join(';');

    const vals = [p.coins ?? '12,450', p.seeds ?? '340', p.flowers ?? '27'];
    const chips = [['CoinChip', 'icons/icon_coin.svg'], ['SeedChip', 'icons/icon_seed.svg'], ['FlowerChip', 'icons/icon_flower.svg']]
      .map((c, i) => ({ layer: c[0], icon: c[1], value: vals[i] }));

    const tabs = TABS.map((t, i) => {
      const w = Math.max(0, Math.min(1, 1 - Math.abs(i - pos)));
      const isActive = w > 0.999;
      const isPressed = pressed === i;
      const onPeach = isActive || w > 0.55;
      let fill = 'transparent', border = '2px solid transparent';
      if (isActive) { fill = isPressed ? '#E8A374' : '#FFB88C'; border = '2px solid rgba(45,52,54,.14)'; }
      else if (w > 0) { fill = 'rgba(255,184,140,' + (w * 0.5).toFixed(2) + ')'; border = '2px solid rgba(45,52,54,.10)'; }
      else if (isPressed) fill = 'rgba(255,248,240,.12)';
      const scaleDown = isPressed ? ';transform:scale(.96)' : '';
      return {
        layer: t[0], label: t[1],
        icon: 'icons/tab_' + t[2] + (onPeach ? '' : '_light') + '.svg',
        hasBadge: badgeOn === i, badge: p.badgeCount ?? '3',
        slotStyle: 'width:216px;height:141px;flex:0 0 auto;position:relative;opacity:' + (locked && !isActive ? 0.6 : 1),
        tileStyle: 'position:absolute;left:16px;top:20px;width:184px;height:108px;box-sizing:border-box;border-radius:20px;display:grid;place-items:center;background:' + fill + ';border:' + border + scaleDown,
        iconStyle: onPeach ? 'width:72px;height:72px;display:block;transform:translateY(-2px)' : 'width:64px;height:64px;display:block;opacity:.82'
      };
    });
    const indLeft = pos * 216 + 72;
    return {
      rootStyle, chips, tabs, locked,
      pageName: pg[0], pageH: 1920 - 143 - 144 - safeTop - safeBottom,
      indicatorStyle: 'position:absolute;top:6px;left:' + indLeft.toFixed(1) + 'px;width:72px;height:8px;border-radius:4px;z-index:1;background:' + (locked ? 'rgba(255,184,140,.4)' : '#FFB88C')
    };
  }
}
</script>
</body>
</html>
