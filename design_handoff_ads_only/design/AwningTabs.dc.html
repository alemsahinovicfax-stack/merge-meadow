<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
</helmet>
<div data-layer="ShopTabBar" data-tabs="{{ n }}" style="position:relative;width:1080px;height:172px;font-family:Nunito,system-ui,sans-serif">
  <sc-for list="{{ stripes }}" as="a" hint-placeholder-count="18">
    <div style="position:absolute;left:{{ a.ix }}px;top:6px;width:68px;height:164px;border-radius:0 0 34px 34px;background:rgba(26,26,20,.16)"></div>
  </sc-for>
  <sc-for list="{{ stripes }}" as="a" hint-placeholder-count="18">
    <div style="position:absolute;left:{{ a.ix }}px;top:0;width:68px;height:164px;border-radius:0 0 34px 34px;background:#2D3436"></div>
  </sc-for>
  <sc-for list="{{ stripes }}" as="a" hint-placeholder-count="18">
    <div style="position:absolute;left:{{ a.x }}px;top:0;width:60px;height:160px;border-radius:0 0 30px 30px;background:{{ a.fill }}"></div>
  </sc-for>
  <div style="position:absolute;left:0;top:10px;width:1080px;height:128px">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <div style="position:absolute;left:{{ t.x }}px;top:0;width:{{ tw }}px;height:120px;box-sizing:border-box;border-radius:60px;background:#FFFFFF;border:3px solid #2D3436"></div>
    </sc-for>
    <div data-layer="ShopTabThumb" style="position:absolute;top:0;left:{{ thumbX }}px;width:{{ tw }}px;height:120px;box-sizing:border-box;border-radius:60px;background:#FFB88C;border:4px solid #2D3436;box-shadow:0 6px 0 rgba(26,26,20,.24);transition:left {{ tDur }}s cubic-bezier(.33,1,.68,1)"></div>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
      <div data-layer="ShopTab" data-tab="{{ t.id }}" data-active="{{ t.active }}" onClick="{{ t.onTap }}" style="position:absolute;left:{{ t.x }}px;top:0;width:{{ tw }}px;height:120px;display:grid;place-items:center;cursor:pointer;font:900 44px/1 Nunito,system-ui,sans-serif;color:#2D3436;white-space:nowrap" style-active="transform:scale(.97)">{{ t.label }}</div>
    </sc-for>
  </div>
  <sc-if value="{{ guides }}" hint-placeholder-val="{{ false }}">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="0">
      <div style="position:absolute;left:{{ t.x }}px;top:138px;width:{{ tw }}px;height:30px;display:flex;align-items:center;justify-content:center;font:800 22px/1 ui-monospace,Menlo,monospace;color:#2D3436"><span style="background:#FFF8F0;border:2px solid #2D3436;border-radius:8px;padding:2px 8px">x {{ t.x }} · w {{ tw }}</span></div>
    </sc-for>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:180},&quot;n&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[3,4],&quot;default&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;seasons&quot;,&quot;looks&quot;,&quot;boosters&quot;,&quot;support&quot;],&quot;default&quot;:&quot;seasons&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;guides&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;slow&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;onTab&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;}}">
const ALL = [['seasons', 'Seasons'], ['looks', 'Looks'], ['boosters', 'Boosters'], ['support', 'Support']];
function layout(n) {
  const inner = 1032, gap = 12, w = Math.floor((inner - (n - 1) * gap) / n);
  const used = n * w + (n - 1) * gap, x0 = 24 + Math.round((inner - used) / 2);
  return { w, step: w + gap, x0 };
}
class Component extends DCLogic {
  state = { active: null };
  componentDidUpdate(pp) { if (pp.active !== this.props.active) this.setState({ active: null }); }
  renderVals() {
    const p = this.props, n = +p.n === 4 ? 4 : 3, L = layout(n);
    const ids = ALL.slice(0, n);
    const act = this.state.active || p.active || 'seasons';
    const ai = Math.max(0, ids.findIndex(t => t[0] === act));
    const stripes = Array.from({ length: 18 }, (_, i) => ({ x: i * 60, ix: i * 60 - 4, fill: i % 2 ? '#FFF8F0' : '#A8E6CF' }));
    return {
      n, tw: L.w, stripes, guides: !!p.guides,
      thumbX: L.x0 + ai * L.step, tDur: (0.2 * Math.max(1, +(p.slow || 1))).toFixed(2),
      tabs: ids.map(([id, label], i) => ({ id, label, x: L.x0 + i * L.step, active: i === ai ? 'yes' : 'no', onTap: () => { this.setState({ active: id }); if (p.onTab) p.onTab(id); } }))
    };
  }
}
</script>
</body>
</html>
