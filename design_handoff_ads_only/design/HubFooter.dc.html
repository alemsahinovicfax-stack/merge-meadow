<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-layer="Footer" style="width:1080px;height:144px;position:relative;z-index:5;background:#2A2233;box-shadow:0 -6px 0 rgba(20,14,26,.34)">
  <div style="height:3px;background:rgba(255,248,240,.55)"></div>
  <div style="position:relative;height:141px;display:flex">
    <div data-layer="ActiveIndicator" style="position:absolute;top:6px;left:{{ indX }}px;width:72px;height:8px;border-radius:4px;z-index:1;background:#FFB88C"></div>
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
      <div data-layer="FooterTab" style="width:216px;height:141px;flex:0 0 auto;position:relative">
        <sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}">
          <div style="position:absolute;left:16px;top:20px;width:184px;height:108px;box-sizing:border-box;border-radius:20px;display:grid;place-items:center;background:#FFB88C;border:2px solid rgba(45,52,54,.14)"><img src="{{ t.srcOn }}" alt="" style="width:72px;height:72px;display:block;transform:translateY(-2px)"></div>
        </sc-if>
        <sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}">
          <div style="position:absolute;left:16px;top:20px;width:184px;height:108px;border-radius:20px;display:grid;place-items:center"><img src="{{ t.src }}" alt="" style="width:64px;height:64px;display:block;opacity:.82"></div>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:144},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;shop&quot;,&quot;journal&quot;,&quot;home&quot;,&quot;camp&quot;,&quot;arena&quot;],&quot;default&quot;:&quot;shop&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const IDS = ['shop', 'journal', 'home', 'camp', 'arena'];
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'shop';
    return {
      indX: IDS.indexOf(a) * 216 + 72,
      tabs: IDS.map(id => ({ on: id === a, off: id !== a, src: 'icons/tab_' + id + '_light.svg', srcOn: 'icons/tab_' + id + '.svg' }))
    };
  }
}
</script>
</body>
</html>
