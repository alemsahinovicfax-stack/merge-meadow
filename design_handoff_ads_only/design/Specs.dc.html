<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#1A1420}a{color:#FFB88C}a:hover{color:#FFF8F0}</style>
</helmet>
<div style="box-sizing:border-box;padding:96px;display:flex;flex-direction:column;gap:56px;font-family:Nunito,system-ui,sans-serif;color:#FFF8F0;width:2200px">
  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="font:900 72px/1.05 Nunito,system-ui,sans-serif">Specs · ads-only v1</div>
    <div style="display:flex;gap:20px;flex-wrap:wrap;font:800 30px/1 Nunito,system-ui,sans-serif">
      <a href="ShopTabs.dc.html">A · ShopTabs</a><a href="ShopCoins.dc.html">ShopCoins</a><a href="HomeSeasons.dc.html">B · HomeSeasons</a><a href="CoinPrice.dc.html">C · CoinPrice</a><a href="PremiumTag.dc.html">D · PremiumTag</a><a href="CampTheme.dc.html">E · CampTheme</a>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px">
    <sc-for list="{{ tables }}" as="t" hint-placeholder-count="6">
      <div style="box-sizing:border-box;border-radius:28px;overflow:hidden;border:4px solid #2D3436;background:#FBEDD7;color:#2D3436">
        <div style="padding:24px 32px;background:#2D3436;color:#FFF8F0;font:900 38px/1 Nunito,system-ui,sans-serif">{{ t.title }}</div>
        <sc-for list="{{ t.rows }}" as="r" hint-placeholder-count="5">
          <div style="display:grid;grid-template-columns:340px 1fr;gap:24px;padding:16px 32px;border-top:2px solid rgba(45,52,54,.15);align-items:center">
            <span style="font:800 28px/1.3 Nunito,system-ui,sans-serif">{{ r.k }}</span>
            <div style="display:flex;align-items:center;gap:14px">
              <sc-if value="{{ r.sw }}" hint-placeholder-val="{{ false }}"><div style="width:40px;height:40px;flex:0 0 auto;border-radius:10px;border:3px solid #2D3436;background:{{ r.sw }}"></div></sc-if>
              <span style="font:700 26px/1.35 ui-monospace,Menlo,monospace;color:#3B4244;text-wrap:pretty">{{ r.v }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = (title, rows) => ({ title, rows: rows.map(([k, v, sw]) => ({ k, v, sw: sw || '' })) });
class Component extends DCLogic {
  renderVals() {
    return { tables: [
      T('A · Tenda (shop_tabs.json)', [
        ['Širina taba', 'w = floor((1032 − 12·(n−1)) / n) → n3: 336 · n4: 249'],
        ['x taba', 'x0 = 24 + round((1032 − used)/2); x = x0 + i·(w+12) → n3: 24/372/720'],
        ['Visina / radius', 'tab 120 · r 60 · y 10 · traka 172'],
        ['Pruge', '18 × 60 px, 160 h, r 0 0 30 30, obrub 4 ink, sjena +6', '#A8E6CF'],
        ['Aktivni thumb', 'peach, obrub 4, sjena 0 6 0 · klizi 0,20 s', '#FFB88C'],
        ['Crtanje', 'tenda se crta jednom (_draw na resize / n promjena)']
      ]),
      T('C · CoinPrice (coin_price.json)', [
        ['S / M / L', '300×120 f44 · 320×120 f52 · 360×132 f56'],
        ['Može', 'zlatno, obrub 4 ink, sjena 0 8 0 a.28', '#FFD56B'],
        ['Fali', 'krem, obrub ink 35 %, bez sjene, y +8, tekst #555C5E', '#F1EAE0'],
        ['Potvrda', 'ink lice, zlatna SVG kvačica = veličina novčića, traka 8 px 3 s', '#2D3436'],
        ['Kupuje se / Yours', 'mint, ink kvačica 0.8×, 0,6 s', '#A8E6CF'],
        ['Play (tema kupljena)', 'peach + ▶', '#FFB88C'],
        ['„Need N"', 'oblačić h 64, f 34, 1,6 s, iznad (Camp: ispod)', '#FFE8B8'],
        ['IAP (kasnije)', 'MONEY lice, € tekst', '#D4A5FF']
      ]),
      T('B · Home tabovi (home_season_tabs.json)', [
        ['Tabovi', 'Journey (icon_seed) · Themes (icon_special)'],
        ['Mjere', 'traka 1032×124 r 62 · tab 508×108 · font 46 · ikona 56'],
        ['Journey aktivan', 'krem lice, obrub 3, sjena +6', '#FFF8F0'],
        ['Themes aktivan', 'Special plava, obrub 3, sjena +6', '#C2E2FA'],
        ['Kartica teme', 'unutrašnji rub 8 px Special plava (bez maske: StyleBoxFlat border)'],
        ['B3 štednja', 'pilula 72 h · „4,200 / 10,000" · mint kad dosta']
      ]),
      T('D · Special (premium_tag.json)', [
        ['Boja', 'Special plava, tekst #2D3436 (11 : 1)', '#C2E2FA'],
        ['L / M / S', 'h 60 f34 i36 · h 52 f32 i32 · h 44 f26 i26'],
        ['Obrub', '3 ink, bez sjene, pill'],
        ['Mjesta', 'Shop Sir Pip L · Camp M · Ormar S · Home tab (ikona)']
      ]),
      T('Efekti (sve ≤ 0,6 s)', [
        ['Drhtaj', '0,32 s, ±12/±8 px'],
        ['Puls coin čipa', '0,30 s scale 1→1.12→1'],
        ['Potvrda pop', '0,22 s scale 1.06'],
        ['Prsten kupovine', '0,42 s, 1 krug obrub 12'],
        ['Oblačić', 'ulaz 0,15 s, živi 1,6 s (timer, ne po frejmu)']
      ]),
      T('Tekst (v1)', [
        ['Cijena', 'UiChrome.format_count → „10,000"'],
        ['Fali', '„Need 5,800 more coins"'],
        ['Kupljeno', '„Yours" · „Wearing" · „Play"'],
        ['Zabranjeno', '€ $ · Restore purchases · Purchase cancelled · billing · Premium']
      ])
    ] };
  }
}
</script>
</body>
</html>
